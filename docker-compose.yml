services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora
      POSTGRES_DB: nexora
    volumes:
      - nexora_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://nexora:nexora@db:5432/nexora?schema=public"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-change-me-please-generate-a-secret}"
      AUTH_SECRET: "${AUTH_SECRET:-change-me-please-generate-a-secret}"
      ABACUSAI_API_KEY: "${ABACUSAI_API_KEY:-}"
      AWS_REGION: "${AWS_REGION:-}"
      AWS_BUCKET_NAME: "${AWS_BUCKET_NAME:-}"
      AWS_FOLDER_PREFIX: "${AWS_FOLDER_PREFIX:-}"
      SEED_ON_START: "${SEED_ON_START:-true}"
    ports:
      - "3000:3000"

volumes:
  nexora_db:
